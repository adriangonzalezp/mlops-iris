name: CI/CD for MLOps Iris Project

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  retraining_model:
    runs-on: ubuntu-latest
    container: docker://dvcorg/cml:latest
    env:
      repo_token: ${{ secrets.GITHUBTOKEN }}
    steps:
      - uses: actions/checkout@v2

      - name: Upgrade pip
        run: pip install --upgrade pip

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run training script
        run: python retraining.py

      build_and_deploy:
        needs: retraining_model
        runs-on: ubuntu-latest
    
        steps:
          - uses: actions/checkout@v2
    
          - name: Login to DockerHub
            uses: docker/login-action@v2
            with:
              username: ${{ secrets.DOCKER_USERNAME }}
              password: ${{ secrets.DOCKER_PASSWORD }}
    
          - name: Build Docker image
            run: docker build -t ${{ secrets.DOCKER_USERNAME }}/mlops-iris:latest .
    
          - name: Push Docker image to DockerHub
            run: docker push ${{ secrets.DOCKER_USERNAME }}/mlops-iris:latest
    
          - name: Deploy to EC2 via SSH
            uses: appleboy/ssh-action@v0.1.6
            with:
              host: ${{ secrets.EC2_HOST }}
              username: ${{ secrets.EC2_USERNAME }}
              key: ${{ secrets.EC2_PRIVATE_KEY }}
              script: |
                docker stop mlops-iris || true
                docker rm mlops-iris || true
                docker pull ${{ secrets.DOCKER_USERNAME }}/mlops-iris:latest
                docker run -d -p 8501:8501 --name mlops-iris ${{ secrets.DOCKER_USERNAME }}/mlops-iris:latest
      
